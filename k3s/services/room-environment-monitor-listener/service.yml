---
apiVersion: v1
kind: Service
metadata:
  namespace: reml
  name: room-environment-monitor-listener-service
spec:
  type: LoadBalancer
  selector:
    app: room-environment-monitor-listener
  ports:
    - name: rest-server
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: mqtt
      port: 1883
      targetPort: 1883
      protocol: TCP
  loadBalancerIP: 192.168.4.158
